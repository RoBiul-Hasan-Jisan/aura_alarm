name: aura_alarm
description: Aura Alarm – Daily Affirmations & Smart Alarm
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  http: ^1.2.1
  google_fonts: ^6.2.1
  share_plus: ^9.0.0
  alarm: ^5.0.0              # rings at the set time, even when the app is closed (Android/iOS)
  audioplayers: ^6.1.0       # ringtone preview + in-browser alarm sound
  permission_handler: ^11.3.1
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/ringtones/

# App icon (Android, iOS, web). Generate with:  dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 23
  remove_alpha_ios: true
  adaptive_icon_background: "assets/icon/app_icon_background.png"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#0A0916"
    theme_color: "#0A0916"
